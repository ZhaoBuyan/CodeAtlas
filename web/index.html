<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Atlas</title>
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/web/icon.png" sizes="64x64" />
  <link rel="stylesheet" href="/web/style.css" />
  <script src="/vendor/d3.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">Code&nbsp;Atlas<span class="ver" id="ver"></span></div>
    <div id="meta" class="meta"></div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="panel">
        <label class="field">
          <span data-en="Group by">分组方式</span>
          <select id="groupBy"></select>
          <span id="groupHint" class="hintline"></span>
        </label>
        <label class="field" id="depthField">
          <span data-en="Group depth">分组层级</span>
          <select id="groupDepth">
            <option value="1" data-en="1 level">1 层</option>
            <option value="2" data-en="2 levels">2 层</option>
            <option value="3" data-en="3 levels">3 层</option>
            <option value="4" data-en="4 levels">4 层</option>
            <option value="0" data-en="All">全部</option>
          </select>
        </label>
        <label class="field">
          <span data-en="View">视图</span>
          <select id="view">
            <option value="treemap" data-en="Treemap">树形图</option>
            <option value="tree" data-en="Tree list">树状列表</option>
            <option value="graph" data-en="Dependency graph">依赖图</option>
            <option value="matrix" data-en="Dependency matrix">依赖矩阵</option>
          </select>
        </label>
        <label class="field">
          <span data-en="Area means">面积代表</span>
          <select id="metric"></select>
        </label>
        <label class="field">
          <span data-en="Color by">着色</span>
          <select id="colorMode">
            <option value="file" data-en="By file">按文件</option>
            <option value="group" data-en="By group">按分组</option>
            <option value="kind" data-en="By kind">按类型类别</option>
            <option value="git" data-en="Git heat">git 热度</option>
          </select>
        </label>
        <label class="field">
          <span data-en="Search">搜索</span>
          <input id="q" type="search" placeholder="类型 / 成员 / 命名空间" data-en-ph="type / member / namespace" />
        </label>
        <label class="field check">
          <input id="depFocus" type="checkbox" />
          <span data-en="Dependency focus (only the selection and its neighbours)">依赖聚焦（只看选中项及其关联）</span>
        </label>
        <label class="field check" id="hideGenField">
          <input id="hideGen" type="checkbox" />
          <span><span data-en="Hide compiler-generated">隐藏编译器生成物</span> <b id="genCount"></b></span>
        </label>
        <label class="field">
          <span><span data-en="Min code lines">最小代码行</span> <b id="minCodeVal">0</b></span>
          <input id="minCode" type="range" min="0" max="300" step="10" value="0" />
        </label>
      </div>

      <div class="panel">
        <div class="panel-title" data-en="Type kinds">类型类别</div>
        <div id="kinds" class="kinds"></div>
      </div>

      <div class="panel" id="langPanel">
        <div class="panel-title" data-en="Languages">语言</div>
        <div id="langs" class="kinds"></div>
      </div>

      <div class="panel">
        <div class="panel-title" id="legendTitle" data-en="Group">分组</div>
        <ul id="legend" class="legend"></ul>
      </div>

      <div class="panel">
        <div class="panel-title" id="topTitle" data-en="Largest types">最大的类型</div>
        <ol id="topList" class="toplist"></ol>
      </div>
    </aside>

    <section id="stage">
      <div id="crumbs" class="crumbs"></div>
      <div id="chart"></div>
      <div id="mapbtns">
        <button id="selClear" data-en="Clear selection" data-en-title="Clear the selection (the inspector empties too)" title="取消选中的模块（右边详情跟着清空）">取消选中</button>
      </div>
    </section>

    <aside id="inspector"></aside>
  </main>

  <footer id="statusbar"></footer>
  <div id="tooltip" class="tooltip hidden"></div>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
