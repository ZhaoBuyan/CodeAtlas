name: CI

# 推代码/PR：与本地 test:ci 使用同一个完整检查入口
# 打 tag（v*）：同上 + 打两个发行版 exe，并挂到 GitHub Release 当下载资产
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read         # 默认只读；只有打 tag 的 release 作业需要写（见下面那行）

jobs:
  test:
    name: 测试（语言 fixtures 回归 + MCP 自检）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 启动器构建要 dotnet（`npm run launcher` 那一步）；发行版打包在 release 作业里另配一份
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 装依赖
        run: npm ci

      - name: 完整检查（统一入口，含版本 / 引擎 / 安全 / MCP / 启动器）
        run: npm run test:ci

  release:
    name: 打包发行（只在打 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write    # 创建 Release / 上传资产要写权限；只给这个作业，不给整个工作流
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 装依赖
        run: npm ci

      - name: 打两个发行版（完全版 + 精简版）
        run: npm run publish

      - name: 核对产物
        run: |
          Get-ChildItem publish-sc, publish-lite | Select-Object Name, Length

      # Release 正文从 CHANGELOG.md 里抽（用户可见口径），不用 generate_release_notes：
      # 自动生成的是提交列表，而项目一贯是"挑用户看得见的变化 + 如实写局限"。
      # 正文来源放在仓库内的 CHANGELOG 里 —— 工作文档/ 不进仓库，CI checkout 拿不到它。
      - name: 从 CHANGELOG 抽 Release 正文
        run: node tools/release-notes.mjs ${{ github.ref_name }} release-body.md

      - name: 发布到 GitHub Release（资产 = 两个 exe）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish-sc/CodeAtlas.exe
            publish-lite/CodeAtlas-lite.exe
          body_path: release-body.md
